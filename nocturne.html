    <div class="container" id="words">
        <script>
            const sections = [
                { text: "<i>Nocturne</i> opens monochromatically—the first phrase, built entirely from the white keys, comprises notes from a single Lydian scale.", start: 1},
                { text: "In capturing beauty, the snapshot-aesthetic of dawn—kaleidoscopic, the sun bisected by the horizon—neglects its essence. Beauty is not from moments but from processes.", start: 4.3, newParagraph: true},
                { text: "What is a gorgeous harmonic resolution without the preceding tension?", start: 11.5},
                { text: "So <i>Nocturne</i> is dawn, and in reality dawn begins not with crimson or magenta, but with deep blue.", start: 15},
                { text: "The next phrase brings us another color:", start: 19.2, newParagraph: true},
                { text: "perhaps royal purple,", start: 22.6},
                { text: "still dark and steady.", start: 26.1},
                { text: "Deep blue returns,", start: 34},
                { text: "brightening imperceptibly.", start: 41},
                { text: "In the final phrase of the opening, low grey clouds drift into view.", start: 48.5},
                { text: "The phrase closes with a measure without a sustained bass note, without pedal—", start: 59.5, noSpace: true},
                { text: "where the hazy, dusky colors give way for specks of pink.", start: 62},
                { text: "Then the colors come all at once—", start: 65.3, newParagraph: true, noSpace: true},
                { text: "after pinks come ambers, golds, violets, the world unfurling with increased urgency and intensity.", start: 68.5},
                { text: "The sun appears;", start: 71.9},
                { text: "ascends,", start: 84.5},
                { text: "from a single-voice melody to octaves;", start: 87},
                { text: "at its climax, becomes too bright to behold.", start: 94.5},
                { text: "One must look away.", start: 100},
                { text: "But light creeps", start: 107},
                { text: "around corners,", start: 113},
                { text: "flashes across waters;", start: 118},
                { text: "it insists—", start: 124},
                { text: "A variant on the opening theme returns, in a higher register, marked by a sparkling broken-octaves accompaniment—", start: 129, newParagraph: true, noSpace: true},
                { text: "morning’s bells, or birdsong.", start: 134.5},
                { text: "Blue again, but brighter.", start: 140},
                { text: "Sunrise is asymmetric.", start: 151},
                { text: "Whereas previously the east surged, luminous, the west proceeds unhurriedly.", start: 162.8},
                { text: "<i>Nocturne</i>, originally from French, means <i>of the night</i>;", start: 186, newParagraph: true},
                { text: "thus its closing heralds day.", start: 191.5},
